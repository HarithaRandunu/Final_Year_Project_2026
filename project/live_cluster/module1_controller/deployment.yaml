apiVersion: v1
kind: ServiceAccount
metadata:
  name: module1-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: module1-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: module1-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: module1-controller
subjects:
  - kind: ServiceAccount
    name: module1-controller
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: module1-controller
  labels:
    app: module1-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: module1-controller
  template:
    metadata:
      labels:
        app: module1-controller
    spec:
      serviceAccountName: module1-controller
      containers:
        - name: module1-controller
          image: module1-controller:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: module1-controller
  labels:
    app: module1-controller
spec:
  ports:
    - port: 8000
  selector:
    app: module1-controller
