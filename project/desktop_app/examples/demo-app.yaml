# A minimal third-party application, for trying the Target App page's
# "Apply a manifest" path (Milestone 6) without needing an app of your own.
#
# In the desktop app: Target App -> Apply a manifest -> paste this file's path
# -> Apply, then switch to "App already in the cluster", pick demo-whoami,
# leave the probe path as "/", and click Switch target.
#
# Why traefik/whoami: it is ~7MB, starts in under a second, holds almost no
# memory, and answers HTTP 200 with plain text on "/" - so it exercises the
# whole plug-in flow without competing with the cluster for the RAM this
# project is already tight on (see docs/Full_Plan_MultiSignal_Autoscaling.md
# Section 11). It does need internet access the first time, to pull the image.
#
# Nothing in here is specific to this framework: it is an ordinary Deployment
# plus Service. That is the point - Module 1 finds the pods via the
# Deployment's own labels and probes them through the Service, so any app
# shaped like this one can be plugged in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-whoami
  labels:
    app: demo-whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-whoami
  template:
    metadata:
      labels:
        app: demo-whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.1
          ports:
            - containerPort: 80
          # Explicit limits are what make Module 1's cpu_utilization and
          # memory_utilization meaningful: it reports usage as a percentage of
          # the container's limit, and falls back to assuming 1000m/1Gi when a
          # pod declares none - which would make a tiny app look permanently
          # idle.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-whoami
  labels:
    app: demo-whoami
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: demo-whoami
